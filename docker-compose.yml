services:
  backend:
    build: .
    env_file: .env
    environment:
      - TZ=Asia/Kolkata
    network_mode: host
    # Host networking: Mongo runs as a replica set on 127.0.0.1 (mongoose
    # connects with directConnection=true). Under bridge networking, 127.0.0.1
    # inside the container is the container itself, not the host, so the
    # connection breaks. Host mode fixes that. SECURITY: this bypasses
    # Docker's own loopback-only port binding, so ufw is the real boundary —
    # never open 4000 there.
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
